name: Validate portable source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r runtime/requirements.txt
      - run: npm run build
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        run: npm run test:control-portable
      - if: runner.os != 'Windows'
        run: npm run test:runtime
      - if: runner.os != 'Windows'
        run: python -B -m unittest discover -s tests/controlplane -v
      - if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests/controlplane -p test_agent_deployment.py -v
      - name: Research and evaluation contracts (no model or remote evaluation)
        if: runner.os != 'Windows'
        run: |
          python -B tests/test-selection-directions.py
          python -B tests/test-recovery-clock.py
          python -B tests/test-e2e-contracts.py
          python -B tests/test-remote-evaluation.py
          python -B tests/test-evaluation-retention.py
          python -B tests/test-budget-handoff.py
      - run: node scripts/package-plugin.mjs
