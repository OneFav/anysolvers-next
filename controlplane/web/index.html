<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AnySolvers · 任务控制台</title><link rel="stylesheet" href="/style.css"><body><header><span>AS / NEXT</span><h1>任务控制台</h1><p>关注需要处理的异常、等待答复的任务与阶段交付。</p><form id="connect"><input id="token" type="password" placeholder="本机 Operator Token" autocomplete="off" required><button>连接</button><span id="connection">未连接</span></form></header><main><section><h2>飞书接入</h2><div id="sources"></div></section><section><h2>需要关注</h2><div id="incidents"></div></section><section><h2>进行中的任务</h2><div id="jobs"></div></section><section><h2>已交付</h2><div id="deliveries"></div></section><section><h2>框架改进请求</h2><div id="framework"></div></section><section><h2>执行节点与版本</h2><div id="hosts"></div></section><section><h2>最近事件</h2><div id="events"></div></section></main><script src="/app.js"></script></body></html>
